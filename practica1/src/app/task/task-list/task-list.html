<h2>Tareas del Sprint:</h2>
<input type="text"
placeholder="Buscar tarea..."
[value]="search()"
(input)="search.set($event.target.value)">

<p>{{pending()}} pendientes de {{filtered().length}}</p>

@for (task of filtered(); track task.id){
    <div class = "row"
    [class.done] = "task.status === 'done'"
    [class.active] = "task.status === 'in-progress'"
    click = "toggle(task)"
    (keydown.enter) = "toggle(task)"
    tobindex = "0">
    <span class="title">{{task.title}}/</span>
    <span class="badge">{{label(task.status)}}/</span>
    <span class="badge">P{{task.priority}}</span>
</div>
}
@empty{
    <p class="empty">Sin resultados</p>
}
